<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Better Bookmarks</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
        </svg>
        <input id="search" type="text" placeholder="Search all bookmarks & folders..." autocomplete="off" />
        <button id="clearSearch" class="icon-btn hidden" title="Clear search">&times;</button>
      </div>
    </header>

    <div class="quick-add">
      <button id="saveCurrentTab" class="primary-btn">
        <span class="plus">+</span> Save current tab
      </button>
      <div id="saveFolderPicker" class="folder-picker hidden">
        <select id="folderSelect"></select>
        <button id="confirmSave" class="small-btn">Save</button>
        <button id="cancelSave" class="small-btn ghost">Cancel</button>
      </div>
    </div>

    <div id="results" class="results hidden"></div>
    <div id="tree" class="tree"></div>
    <div id="emptyState" class="empty-state hidden">No matches found.</div>

    <footer>
      <button id="newRootFolder" class="link-btn">+ New folder</button>
      <button id="openManager" class="link-btn">Open full manager</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
